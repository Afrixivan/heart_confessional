  <main class="relax-section">
    <div class="container">
      <h2 class="section-title">4-7-8呼吸练习</h2>
      <p class="section-subtitle">通过深呼吸帮助你放松身心，缓解焦虑和压力</p>

      <div class="breathing-container">
        <div id="breathing-circle" class="breathing-circle">
          🌬️
        </div>
        
        <div id="breathing-instruction" class="breathing-instruction">
          准备开始
        </div>

        <div class="breathing-controls">
          <button id="start-breathing" class="btn btn-primary">开始练习</button>
          <button id="stop-breathing" class="btn btn-secondary" style="display: none;">停止练习</button>
        </div>

        <div style="margin-top: 40px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto;">
          <h4 style="font-size: 18px; margin-bottom: 15px;">💡 什么是4-7-8呼吸法？</h4>
          <p style="color: #666; line-height: 1.7; margin-bottom: 20px;">
            4-7-8呼吸法是一种简单有效的放松技巧，由哈佛医学院的安德鲁·韦尔博士推广。它通过特定的呼吸节奏帮助激活身体的放松反应。
          </p>
          <h4 style="font-size: 18px; margin-bottom: 15px;">📋 练习步骤</h4>
          <ul style="color: #666; line-height: 1.7;">
            <li><strong>吸气</strong>（4秒）：用鼻子深吸气，感受腹部像气球一样鼓起</li>
            <li><strong>屏息</strong>（7秒）：屏住呼吸，保持感受</li>
            <li><strong>呼气</strong>（8秒）：用嘴巴慢慢呼气，发出"嘶"的声音</li>
          </ul>
          <p style="color: #666; line-height: 1.7; margin-top: 20px;">
            建议每天练习2-3次，每次4-6轮。坚持练习可以帮助你在感到焦虑或紧张时快速恢复平静。
          </p>
        </div>
      </div>
    </div>
